   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25837b" x="39.6" y="32.999375" transform="rotate(-0 39.6 32.999375)">THE CONSTRUCTION, STEP BY STEP</text>
   </g>
   <g id="text_2">
    <text style="font-size: 25px; font-family: 'DejaVu Serif'; text-anchor: start; fill: #203d4d" x="39.6" y="76.560703" transform="rotate(-0 39.6 76.560703)">When a premise changes, revisit the answer</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5d6f77" x="39.6" y="105.995312" transform="rotate(-0 39.6 105.995312)">One release, two immutable revisions. The policy is explicit in both.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203d4d" x="57.6" y="166.75125" transform="rotate(-0 57.6 166.75125)">Policy:  (API v2 ∧ tests pass) → ready       and       ¬tests pass → ¬ready</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25837b" x="55.44" y="234.599375" transform="rotate(-0 55.44 234.599375)">01</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203d4d" x="90" y="234.968359" transform="rotate(-0 90 234.968359)">Accept the starting facts</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5d6f77" transform="translate(55.44 270.382266)">Revision 12</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5d6f77" transform="translate(55.44 284.999375)">API v2 active</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5d6f77" transform="translate(55.44 299.616484)">Tests pass</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #25837b" x="187.2" y="329.552266" transform="rotate(-0 187.2 329.552266)">PROVED: ready</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25837b" x="372.24" y="234.599375" transform="rotate(-0 372.24 234.599375)">02</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203d4d" x="406.8" y="235.013281" transform="rotate(-0 406.8 235.013281)">Check and save the answer</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5d6f77" transform="translate(372.24 270.382266)">Question: release ready?</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5d6f77" transform="translate(372.24 284.999375)">Solver finds the consequence</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5d6f77" transform="translate(372.24 299.616484)">Certificate checks successfully</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #25837b" x="504" y="329.585469" transform="rotate(-0 504 329.585469)">BOUND TO REVISION 12</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25837b" x="689.04" y="234.599375" transform="rotate(-0 689.04 234.599375)">03</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203d4d" x="723.6" y="235.013281" transform="rotate(-0 723.6 235.013281)">Receive a correction</text>
   </g>
   <g id="text_15">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5d6f77" transform="translate(689.04 270.382266)">New source: tests failed</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5d6f77" transform="translate(689.04 284.999375)">Replace the old test assertion</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5d6f77" transform="translate(689.04 299.616484)">Publish revision 13 atomically</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #b36f48" x="820.8" y="329.585469" transform="rotate(-0 820.8 329.585469)">NEW HEAD: 13</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25837b" x="55.44" y="389.399375" transform="rotate(-0 55.44 389.399375)">04</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203d4d" x="90" y="389.813281" transform="rotate(-0 90 389.813281)">Find affected answers</text>
   </g>
   <g id="text_19">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5d6f77" transform="translate(55.44 425.182266)">Follow premise-use edges</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5d6f77" transform="translate(55.44 439.799375)">Locate recheck candidates</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5d6f77" transform="translate(55.44 454.416484)">Do not infer a new answer yet</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #25837b" x="187.2" y="484.385469" transform="rotate(-0 187.2 484.385469)">DEPENDENCY TRAVERSAL</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25837b" x="372.24" y="389.399375" transform="rotate(-0 372.24 389.399375)">05</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203d4d" x="406.8" y="389.813281" transform="rotate(-0 406.8 389.813281)">Ask at the new revision</text>
   </g>
   <g id="text_23">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5d6f77" transform="translate(372.24 425.182266)">Recheck all accepted assertions</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5d6f77" transform="translate(372.24 439.799375)">The negative policy applies</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5d6f77" transform="translate(372.24 454.416484)">Ready is now refuted</text>
   </g>
   <g id="text_24">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #b36f48" x="504" y="484.352266" transform="rotate(-0 504 484.352266)">REFUTED: ready</text>
   </g>
   <g id="text_25">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25837b" x="689.04" y="389.399375" transform="rotate(-0 689.04 389.399375)">06</text>
   </g>
   <g id="text_26">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203d4d" x="723.6" y="389.813281" transform="rotate(-0 723.6 389.813281)">Keep both explanations</text>
   </g>
   <g id="text_27">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5d6f77" transform="translate(689.04 425.182266)">Revision 12: old proof retained</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5d6f77" transform="translate(689.04 439.799375)">Revision 13: current answer</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5d6f77" transform="translate(689.04 454.416484)">Each record keeps its context</text>
   </g>
   <g id="text_28">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #25837b" x="820.8" y="484.385469" transform="rotate(-0 820.8 484.385469)">HISTORY PRESERVED</text>
   </g>
   <g id="text_29">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5d6f77" x="39.6" y="561.785469" transform="rotate(-0 39.6 561.785469)">A missing positive premise alone does not prove a negative. Refutation here needs the stated negative policy.</text>
   </g>
