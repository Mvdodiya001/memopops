   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25837b" x="39.6" y="32.999375" transform="rotate(-0 39.6 32.999375)">WHAT WE MEASURED</text>
   </g>
   <g id="text_2">
    <text style="font-size: 25px; font-family: 'DejaVu Serif'; text-anchor: start; fill: #203d4d" x="39.6" y="76.560703" transform="rotate(-0 39.6 76.560703)">Strong small-case checks. A clear proof budget.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5d6f77" x="39.6" y="105.995312" transform="rotate(-0 39.6 105.995312)">Synthetic propositional problems · three fresh worker processes · in-memory API store</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25837b" x="55.44" y="164.578438" transform="rotate(-0 55.44 164.578438)">3,000 / 3,000</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203d4d" x="55.44" y="198.968359" transform="rotate(-0 55.44 198.968359)">Logical classifications</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #5d6f77" transform="translate(55.44 223.200131)">Matched a separate exhaustive</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #5d6f77" transform="translate(55.44 235.642682)">truth-table evaluator</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25837b" x="372.24" y="164.578438" transform="rotate(-0 372.24 164.578438)">90 / 90</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203d4d" x="372.24" y="198.968359" transform="rotate(-0 372.24 198.968359)">Revision lifecycle cycles</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #5d6f77" transform="translate(372.24 223.200131)">Passed controlled correction</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #5d6f77" transform="translate(372.24 235.642682)">and revision-guard checks</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25837b" x="689.04" y="164.578438" transform="rotate(-0 689.04 164.578438)">600 / 600</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203d4d" x="689.04" y="198.968359" transform="rotate(-0 689.04 198.968359)">Mutation probes rejected</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #5d6f77" transform="translate(689.04 223.200131)">Tested proof corruption and</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #5d6f77" transform="translate(689.04 235.642682)">certificate-context mismatches</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203d4d" x="46.8" y="285.328438" transform="rotate(-0 46.8 285.328438)">Certificate coverage in the separate scaling workloads</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5d6f77" x="46.8" y="310.199375" transform="rotate(-0 46.8 310.199375)">Verified decisive requests out of 180 per size; equal mix of three workload shapes</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203d4d" x="735.84" y="361.733281" transform="rotate(-0 735.84 361.733281)">A different sample</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b36f48" x="735.84" y="393.659063" transform="rotate(-0 735.84 393.659063)">234 / 240 certified</text>
   </g>
   <g id="text_17">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #5d6f77" transform="translate(735.84 424.592025)">Small generated-case subset.</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #5d6f77" transform="translate(735.84 438.478279)">This rate does not describe</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #5d6f77" transform="translate(735.84 452.364533)">the scaling workloads.</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #5d6f77" transform="translate(735.84 466.250787)">Gray bars = uncertified requests.</text>
   </g>
   <g id="text_18">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b36f48" x="46.8" y="534.119375" transform="rotate(-0 46.8 534.119375)">At 64+ assertions in these workloads, classifications remained correct but no decisive certificate verified.</text>
   </g>
   <g id="text_19">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5d6f77" x="39.6" y="572.585469" transform="rotate(-0 39.6 572.585469)">Source: benchmark-2026-10-25/summary.json · Finite test results; no live FalkorDB or language-model benchmark.</text>
