[project]
name = "memopops"
version = "0.1.0"
description = "Proof-aware shared memory for AI agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "falkordb",
    "fastapi",
    "pydantic",
    "uvicorn>=0.54.0",
    "z3-solver",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis",
    "pytest",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"
